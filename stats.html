<!DOCTYPE html>
<!-- stats.html -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taskitator - Statistics</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b111e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css?v=14">
</head>
<body>

    <div id="backdrop"></div>

    <div id="mobile-header">
        <h2>Taskitator</h2>
        <button id="menu-toggle" aria-label="Toggle navigation">☰</button>
    </div>

    <aside id="sidebar">
        <h2>Taskitator</h2>
        <a href="index.html" class="nav-link">📅 Today's Tasks</a>
        <a href="general.html" class="nav-link">📋 General List</a>
        <a href="stats.html" class="nav-link active">📊 Statistics</a>
        <a href="settings.html" class="nav-link">⚙️ Settings</a>
        <a href="trash.html" class="nav-link">🗑️ Trash Bin</a>
    </aside>

    <main id="main-content">
        <section id="view-area">
            <h1>Workspace Statistics</h1>
            <div id="stats-container" class="stats-grid"></div>
        </section>
    </main>

    <script>
        const toggleBtn = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('backdrop');
        const statsContainer = document.getElementById('stats-container');

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.warn('ServiceWorker registration failed: ', err);
                });
            });
        }

        toggleBtn.addEventListener('click', () => {
            const isOpen = sidebar.classList.toggle('open');
            backdrop.classList.toggle('active', isOpen);
        });

        backdrop.addEventListener('click', () => {
            sidebar.classList.remove('open');
            backdrop.classList.remove('active');
        });

        function getTasks() {
            return JSON.parse(localStorage.getItem('taskitator_tasks')) || [];
        }

        function renderStats() {
            const tasks = getTasks();
            const total = tasks.length;
            const completed = tasks.filter(t => t.status === 'completed').length;
            const active = tasks.filter(t => t.status === 'active').length;
            const trashed = tasks.filter(t => t.status === 'trashed').length;

            statsContainer.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Total Created</div>
                    <div class="stat-value">${total}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Active Tasks</div>
                    <div class="stat-value" style="color: #38bdf8;">${active}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Completed</div>
                    <div class="stat-value" style="color: #10b981;">${completed}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">In Trash</div>
                    <div class="stat-value" style="color: #ef4444;">${trashed}</div>
                </div>
            `;
        }

        renderStats();
    </script>
</body>
</html>
