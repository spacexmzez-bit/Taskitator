# Use your existing Worker project when possible. Preserve any existing routes,
# environments, bindings and migration history; append these new DO entries.
name = "taskitator-sync"
main = "worker.js"
compatibility_date = "2026-10-04"
keep_vars = true

[vars]
ALLOWED_ORIGINS = "https://taskitator.mazendev.com"
# Add Clerk secret/public key, issuer, and migration settings in the Cloudflare
# dashboard as described in SECURITY-SETUP.txt. Do not commit secret keys.

[[kv_namespaces]]
binding = "TASKITATOR_KV"
id = "f20716f5213a4da6bae75182728c1117"

[[durable_objects.bindings]]
name = "TASKITATOR_SYNC"
class_name = "TaskitatorSync"

[[migrations]]
tag = "taskitator-sync-v1"
new_sqlite_classes = ["TaskitatorSync"]

[[d1_databases]]
binding = "TASKITATOR_DB"
database_name = "taskitator-db"
database_id = "77181165-dff3-49c7-907f-521b4b2d3b45"

[[r2_buckets]]
binding = "TASKITATOR_EVIDENCE"
bucket_name = "taskitator-evidence"
