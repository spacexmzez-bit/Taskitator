<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1119">
<title>Study plans — Taskitator</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json">
<style>
.auth-pending body>:not(#authLoadingStatus){visibility:hidden}
.plans-wrap{max-width:720px;margin:24px auto;padding:16px}
.plans-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}.plans-header h1{margin:0;font-size:1.4rem}
.plans-note{color:var(--text-muted,#9bb1d3);line-height:1.6;margin:0 0 12px}
.plans-notice{border:1px solid var(--alert-orange,#f59e0b);border-radius:12px;padding:10px 12px;margin:0 0 14px;line-height:1.5}
.plans-notice[hidden],.plan-panel[hidden],.plans-empty[hidden]{display:none}
.plans-section{margin:22px 0 8px;font-size:1rem;color:var(--text-muted,#9bb1d3)}
.plan-card{border:1px solid var(--border-color,#344b7e);background:var(--card-bg,#081226);border-radius:16px;padding:16px;margin-bottom:12px}
.plan-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap}
.plan-top h2{margin:0;font-size:1.05rem;overflow-wrap:anywhere}
.plan-badges{display:flex;gap:6px;flex-wrap:wrap}
.plan-badge{border:1px solid var(--border-color,#344b7e);border-radius:999px;padding:2px 9px;font-size:.72rem}
.plan-badge.ai{border-color:var(--primary,#3b82f6);color:var(--primary,#3b82f6)}
.plan-meta{margin:8px 0 0;color:var(--text-muted,#9bb1d3);font-size:.85rem;line-height:1.6}
.plan-bar{height:6px;border-radius:999px;background:var(--border-color,#344b7e);margin:10px 0;overflow:hidden}
.plan-bar>span{display:block;height:100%;background:var(--primary,#3b82f6)}
.plan-actions{display:flex;gap:8px;flex-wrap:wrap}
.plan-actions .icon-btn,.plan-panel .icon-btn{width:auto;padding:8px 14px}
.plan-delete{color:var(--danger,#ef4444);border-color:rgba(239,68,68,.45)}
.plan-panel{margin-top:14px;display:grid;gap:12px}
.plan-section{border:1px solid var(--border-color,#344b7e);border-radius:12px;padding:12px;margin:0;min-width:0}
.plan-section legend{padding:0 6px;font-weight:700;font-size:.9rem}
.plan-field{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:.82rem}
.plan-field input,.plan-field select,.plan-field textarea{font:inherit;font-size:.95rem;box-sizing:border-box;width:100%;min-width:0;padding:9px;border-radius:10px;background:var(--input-bg,#172a46);color:var(--text-color,#fff);border:1px solid var(--border-color,#344b7e)}
.plan-field textarea{min-height:84px;resize:vertical}
.plan-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan-hint{margin:6px 0 0;font-size:.78rem;color:var(--text-muted,#9bb1d3);line-height:1.5}
.plan-hint.warn{color:var(--alert-orange,#f59e0b)}
#plansStatus{min-height:1.6em;line-height:1.6;margin-top:10px}

.plan-seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.plan-seg-btn{flex:1;min-width:120px;padding:8px;border-radius:10px;border:1px solid var(--border-color,#344b7e);background:transparent;color:inherit;font:inherit;font-size:.85rem;cursor:pointer}
.plan-seg-btn.is-active{background:var(--primary,#3b82f6);border-color:var(--primary,#3b82f6);color:#fff}
.plan-rates,.plan-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:6px 0}
.plan-rate,.plan-day{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem}
.plan-rate input{width:100%;box-sizing:border-box;padding:6px 2px;text-align:center;border-radius:8px;background:var(--input-bg,#172a46);color:var(--text-color,#fff);border:1px solid var(--border-color,#344b7e);font:inherit}
.plan-days{display:grid;gap:6px;margin-top:10px;max-height:340px;overflow:auto}
.plan-day-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:8px;border:1px solid var(--border-color,#344b7e);border-radius:10px;font-size:.85rem}
.plan-day-units{color:var(--text-muted,#9bb1d3);overflow-wrap:anywhere;font-size:.8rem}
.plan-step{display:flex;align-items:center;gap:6px}
.plan-panel .plan-step .icon-btn{padding:4px 10px}
@media(max-width:480px){.plan-row{grid-template-columns:1fr}.plans-wrap{padding:10px}.plan-card{padding:12px}}
</style><link rel="icon" type="image/svg+xml" href="image/nature_sprites/favicon.svg">
<link rel="stylesheet" href="palettes.css">
<link rel="stylesheet" href="family-nature.css">
<link rel="stylesheet" href="rtl.css">
<script src="registry.js"></script>
<script src="theme-boot.js"></script>
<script src="i18n.js"></script>
<script src="locales/ar.js"></script>
<script defer src="icons.js"></script>
<script defer src="nature.js"></script>
</head><body>
<main class="plans-wrap">
<header class="plans-header"><a class="icon-btn" href="index.html" aria-label="Back to tasks">←</a><h1><svg class="tk-ic" aria-hidden="true" focusable="false"><use href="#ic-book"></use></svg> Study plans</h1></header>
<p class="plans-note">See the plans created by study recurrence, change their names and priorities, add AI criteria, or delete them.</p>
<p id="plansNotice" class="plans-notice" hidden></p>
<div id="plansCurrent"></div>
<h2 id="plansPreviousTitle" class="plans-section" hidden>Previous plans</h2>
<div id="plansPrevious"></div>
<p id="plansEmpty" class="plans-note plans-empty" hidden>No study plans yet. Create one from a study recurrence on the Tasks page.</p>
<p id="plansStatus" role="status" aria-live="polite"></p>
</main>
<script type="text/taskitator-script" src="pro.js"></script>
<script type="text/taskitator-script" src="pro/study-plan.js"></script>
<script type="text/taskitator-script" src="pro/study-manage.js"></script>
<script type="text/taskitator-script" src="study-plans.js"></script>
<script defer src="core.js"></script></body></html>
