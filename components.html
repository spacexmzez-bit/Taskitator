    <!-- Ari Copilot Drawer -->
    <div class="copilot-backdrop" id="copilotBackdrop"></div>
    <aside class="copilot-drawer" id="copilotDrawer">
        <div class="copilot-header">
            <div class="copilot-title-group">
                <h3 id="workspaceCopilotTitle" style="margin:0; font-size:1rem;">Copilot</h3>
            </div>
            <button class="icon-btn" id="closeCopilotBtn">✕</button>
        </div>
        <div id="copilotStandbyView" style="padding:20px; text-align:center;">
            <button id="startCopilotBtn" class="btn-primary">Wake Up Ari</button>
        </div>
        <div id="copilotChatView" class="copilot-chat-view">

<section id="componentView-universe" class="component-view-pane" style="display:none"><div id="universeWorkspace" class="universe-workspace" aria-label="Universe membership"></div></section>
    </div>
<div class="modal-overlay" id="addTaskModal">
    <div class="modal-box">
        <h3 style="margin-top: 0; color: var(--primary);" id="addTaskModalTitle">Create New Task</h3>
        <form id="taskCreateForm">
            <input type="hidden" id="creationParentId" value="">

            <div class="form-group">
                <label for="taskTitleInput">Task Title</label>
                <input type="text" id="taskTitleInput" placeholder="What needs to be done?" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="taskDescInput">Description</label>
                <textarea id="taskDescInput" rows="2" placeholder="Add optional details..."></textarea>
            </div>

            <div class="form-group">
                <label>Project</label>
                <div id="createProjectCloud" class="priority-select-group"></div>
            </div>

            <div class="form-group">
                <label>Priority</label>
                <div id="createPriorityCloud" class="priority-select-group"></div>
            </div>

            <div class="form-group">
                <label>Tags</label>
                <div id="createTagCloud" class="tag-select-cloud"></div>
                <div class="quick-add-tag-group">
                    <input type="text" id="createQuickTagInput" class="quick-add-tag-input" placeholder="Quick add tag..." autocomplete="off">
                    <button type="button" class="icon-btn" id="createQuickTagBtn" style="padding: 4px 10px; font-size: 0.8rem;">+ Add</button>
                </div>
            </div>

            <div class="form-group" id="criteriaBoxContainer" style="display: none;">
                <label for="taskCriteriaInput">Proof Criteria &lt;PC&gt;</label>
                <textarea id="taskCriteriaInput" rows="2" placeholder="Visual verification requirements..."></textarea>
            </div>

            <div class="form-group">
                <label for="taskDueDateInput">Due Date</label>
                <input type="date" id="taskDueDateInput">
            </div>

            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="aiLockCheckbox">
                    <span>Require AI Proof Verification (Irrevocable)</span>
                </label>
            </div>

            <div class="task-modal-actions task-modal-actions-create">
                <button type="button" class="icon-btn" id="closeAddTaskModalBtn">Cancel</button>
                <button type="button" class="icon-btn" id="saveTaskDraftBtn" title="Keep this form for later. Nothing is created or locked.">Draft</button>
                <button type="submit" class="icon-btn" id="submitTaskCreateBtn" style="background: var(--primary); color: #fff; border: none; font-weight: 600;">Save Task</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: Task Detail & Edit Panel -->
<div class="modal-overlay" id="taskDetailModal">
    <div class="modal-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
            <h3 style="margin: 0; color: var(--primary);" id="detailTaskTitleHeader">Task Details</h3>
            <span id="detailLockStatusBadge"></span>
        </div>

        <div class="form-group">
            <label for="editTaskTitle">Title</label>
            <input type="text" id="editTaskTitle">
        </div>

        <div class="form-group">
            <label for="editTaskDesc">Description</label>
            <textarea id="editTaskDesc" rows="2"></textarea>
        </div>

        <div class="form-group">
            <label>Project</label>
            <div id="editProjectCloud" class="priority-select-group"></div>
        </div>

        <div class="form-group">
            <label>Priority</label>
            <div id="editPriorityCloud" class="priority-select-group"></div>
        </div>

        <div class="form-group">
            <label>Tags</label>
            <div id="editTagCloud" class="tag-select-cloud"></div>
        </div>

        <div class="form-group">
            <label for="editTaskDueDate">Due Date</label>
            <input type="date" id="editTaskDueDate">
        </div>

        <div class="task-modal-actions task-modal-actions-edit">
            <button type="button" class="icon-btn" id="deleteFromDetailBtn" style="color: var(--danger); border-color: #7f1d1d;">Delete Task</button>
            <button type="button" class="icon-btn" id="closeDetailModalBtn">Cancel</button>
            <button type="button" class="icon-btn" id="saveEditDraftBtn" title="Keep these edits for later. The task itself is unchanged until you press Save Changes.">Draft</button>
            <button type="button" class="icon-btn" id="saveTaskDetailsBtn" style="background: var(--primary); color: #fff; border: none; font-weight: 600;">Save Changes</button>
        </div>
    </div>
</div>

<!-- Audit Modal -->
<div class="modal-overlay" id="auditModal">
    <div class="modal-box">
        <h3 style="margin-top: 0; color: var(--primary);">Submit AI Verification Proof</h3>
        <p id="auditTaskTitleDisplay" style="font-weight: 600; margin-bottom: 6px;"></p>
        <div id="auditCriteriaDisplay" style="font-size: 0.825rem; color: var(--text-muted); margin-bottom: 14px; background: var(--card-subtle); padding: 10px; border-radius: 6px; border: 1px solid var(--border-color);"></div>

        <div class="form-group">
            <label>Upload Proof (8 MB per photo or 30 MB per PDF):</label>
            <input type="file" id="auditImageInput" accept="image/*,application/pdf">
        </div>

        <div class="form-group">
            <label>Optional Note / Clarification:</label>
            <textarea id="auditContextInput" rows="2" placeholder="Any details for the auditor..."></textarea>
        </div>

        <div id="auditFeedbackContainer" style="display: none;"></div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px;">
            <button type="button" class="icon-btn" id="closeAuditModalBtn">Cancel</button>
            <button type="button" class="icon-btn" id="submitProofBtn" style="background: var(--primary); color: #fff; border: none; font-weight: 600;">Submit Proof</button>
        </div>
    </div>
</div>
