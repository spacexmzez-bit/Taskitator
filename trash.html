<!-- trash.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskitator - Trash</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .trash-item {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--card-shadow);
        }
        .trash-title {
            font-size: 0.95rem;
            color: var(--text-color);
            word-break: break-word;
            font-weight: 500;
        }
        .trash-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .trash-actions {
            display: flex;
            gap: 8px;
        }
        .btn-danger-solid {
            background: var(--danger);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 7px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .btn-danger-solid:hover {
            background: var(--danger-hover);
        }
    </style>
</head>
<body>

<!-- Sidebar Drawer -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="sidebar-drawer" id="sidebarDrawer">
    <div style="font-weight: 800; font-size: 1.25rem; margin-bottom: 24px; color: var(--primary);">Taskitator</div>
    <nav class="drawer-links">
        <a href="index.html">📅 Today</a>
        <a href="general.html">🗂️ General Tasks</a>
        <a href="stats.html">📊 Stats</a>
        <a href="trash.html" class="active">🗑️ Trash</a>
        <a href="settings.html">⚙️ Settings</a>
    </nav>
</aside>

<div class="app-container">
    <!-- Top Navbar -->
    <header class="top-navbar">
        <div class="nav-left">
            <button class="icon-btn" id="openDrawerBtn" title="Menu">☰</button>
            <h2 style="margin: 0; font-size: 1.25rem;">Trash</h2>
        </div>
        <div class="nav-right" style="display: flex; gap: 8px;">
            <button type="button" class="icon-btn" id="openCopilotNavBtn" title="Focus Copilot" style="font-size: 0.85rem; font-weight: 600; padding: 6px 12px;">💬 Copilot</button>
            <button class="btn-danger-solid" id="emptyTrashBtn">Empty Trash</button>
        </div>
    </header>

    <ul class="task-list-tree" id="trashList"></ul>
</div>

<!-- Copilot Slide-Over Drawer -->
<div class="copilot-drawer-backdrop" id="copilotBackdrop"></div>
<aside class="copilot-drawer" id="copilotDrawer">
    <div class="copilot-header">
        <div class="copilot-title-group">
            <span style="font-weight: 800; font-size: 1.05rem;">🤖 Focus Copilot</span>
            <span class="copilot-model-chip">3.5 Flash Lite</span>
        </div>
        <button type="button" class="icon-btn" id="closeCopilotBtn" style="border: none; font-size: 1.2rem; line-height: 1; padding: 4px 8px;">✕</button>
    </div>

    <div class="copilot-messages" id="copilotMessages">
        <div class="copilot-standby-card">
            <div style="font-size: 2rem; margin-bottom: 6px;">🤖</div>
            <strong class="copilot-standby-title" style="font-size: 1rem; color: var(--primary);">Focus Copilot</strong>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin: 6px 0 0 0; line-height: 1.4;">
                Ready. Ask me anything relevant to this page.
            </p>
        </div>
    </div>

    <form class="copilot-footer" id="copilotForm">
        <input type="text" id="copilotInput" placeholder="Ask Copilot..." autocomplete="off" required>
        <button type="submit" class="icon-btn" style="background: var(--primary); color: #fff; border: none; font-weight: 700; padding: 8px 16px;">Send</button>
    </form>
</aside>

<script src="sync-engine.js"></script>
<script src="agent-engine.js"></script>
<script>
const TASKS_KEY = 'taskitator_tasks';
let tasks = [];

function loadTasks() {
    try {
        tasks = JSON.parse(localStorage.getItem(TASKS_KEY) || '[]');
    } catch (e) {
        tasks = [];
    }
}

function saveTasksAndPush() {
    localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
    if (window.SyncEngine) {
        if (typeof SyncEngine.markLocalModified === 'function') {
            SyncEngine.markLocalModified();
        }
        if (typeof SyncEngine.scheduleAutoPush === 'function') {
            SyncEngine.scheduleAutoPush(45000);
        }
    }
}

function renderTrash() {
    const list = document.getElementById('trashList');
    list.innerHTML = '';

    const trashedTasks = tasks.filter(t => t.status === 'trash');

    if (trashedTasks.length === 0) {
        list.innerHTML = '<li style="text-align: center; color: var(--text-muted); padding: 32px;">Trash is empty.</li>';
        return;
    }

    trashedTasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'trash-item';

        const info = document.createElement('div');
        info.innerHTML = `
            <div class="trash-title">${task.title} ${task.ai_locked ? '<span class="ai-badge">🔒 AI</span>' : ''}</div>
            <div class="trash-meta">Created: ${new Date(task.created_at || Date.now()).toLocaleDateString()}</div>
        `;

        const actions = document.createElement('div');
        actions.className = 'trash-actions';

        const restoreBtn = document.createElement('button');
        restoreBtn.className = 'icon-btn';
        restoreBtn.textContent = 'Restore';
        restoreBtn.addEventListener('click', () => restoreTask(task.id));

        const permDelBtn = document.createElement('button');
        permDelBtn.className = 'icon-btn';
        permDelBtn.style.color = 'var(--danger)';
        permDelBtn.style.borderColor = '#7f1d1d';
        permDelBtn.textContent = 'Delete Forever';
        permDelBtn.addEventListener('click', () => permanentlyDeleteTask(task.id));

        actions.appendChild(restoreBtn);
        actions.appendChild(permDelBtn);

        li.appendChild(info);
        li.appendChild(actions);
        list.appendChild(li);
    });
}

function restoreTask(taskId) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;

    if (task.parent_id) {
        const parent = tasks.find(t => t.id === task.parent_id);
        if (!parent || parent.status === 'trash') {
            task.parent_id = null;
        }
    }

    task.status = 'active';

    function recursiveRestoreChildren(parentId) {
        tasks.filter(t => t.parent_id === parentId && t.status === 'trash').forEach(child => {
            child.status = 'active';
            recursiveRestoreChildren(child.id);
        });
    }
    recursiveRestoreChildren(taskId);

    saveTasksAndPush();
    renderTrash();
}

function permanentlyDeleteTask(taskId) {
    if (!confirm('Permanently delete this task and all its subtasks? This cannot be undone.')) return;

    const idsToDelete = new Set();
    function collectIds(targetId) {
        idsToDelete.add(targetId);
        tasks.filter(t => t.parent_id === targetId).forEach(child => collectIds(child.id));
    }
    collectIds(taskId);

    tasks = tasks.filter(t => !idsToDelete.has(t.id));
    saveTasksAndPush();
    renderTrash();
}

document.getElementById('emptyTrashBtn').addEventListener('click', () => {
    const count = tasks.filter(t => t.status === 'trash').length;
    if (count === 0) {
        alert('Trash is already empty.');
        return;
    }
    if (confirm(`Permanently delete all ${count} items in the trash?`)) {
        tasks = tasks.filter(t => t.status !== 'trash');
        saveTasksAndPush();
        renderTrash();
    }
});

window.addEventListener('taskitator-synced', () => {
    loadTasks();
    renderTrash();
});

// Sidebar Drawer
const sidebarDrawer = document.getElementById('sidebarDrawer');
const drawerBackdrop = document.getElementById('drawerBackdrop');

document.getElementById('openDrawerBtn').addEventListener('click', () => {
    sidebarDrawer.classList.add('open');
    drawerBackdrop.classList.add('open');
});

drawerBackdrop.addEventListener('click', () => {
    sidebarDrawer.classList.remove('open');
    drawerBackdrop.classList.remove('open');
});

// Copilot Drawer Toggle
const copilotDrawer = document.getElementById('copilotDrawer');
const copilotBackdrop = document.getElementById('copilotBackdrop');
const openCopilotNavBtn = document.getElementById('openCopilotNavBtn');
const closeCopilotBtn = document.getElementById('closeCopilotBtn');

if (openCopilotNavBtn && copilotDrawer && copilotBackdrop) {
    openCopilotNavBtn.addEventListener('click', () => {
        copilotDrawer.classList.add('open');
        copilotBackdrop.classList.add('open');
        const input = document.getElementById('copilotInput');
        if (input) setTimeout(() => input.focus(), 150);
    });
}

if (closeCopilotBtn && copilotDrawer && copilotBackdrop) {
    closeCopilotBtn.addEventListener('click', () => {
        copilotDrawer.classList.remove('open');
        copilotBackdrop.classList.remove('open');
    });
    copilotBackdrop.addEventListener('click', () => {
        copilotDrawer.classList.remove('open');
        copilotBackdrop.classList.remove('open');
    });
}

document.addEventListener('DOMContentLoaded', () => {
    loadTasks();
    renderTrash();
});

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .catch(err => console.error('SW Registration failed:', err));
    });
}
</script>
</body>
</html>
