<!DOCTYPE html>
<!-- trash.html -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taskitator - Trash Bin</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b111e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css?v=14">
</head>
<body>

    <div id="backdrop"></div>

    <div id="mobile-header">
        <h2>Taskitator</h2>
        <button id="menu-toggle" aria-label="Toggle navigation">☰</button>
    </div>

    <aside id="sidebar">
        <h2>Taskitator</h2>
        <a href="index.html" class="nav-link">📅 Today's Tasks</a>
        <a href="general.html" class="nav-link">📋 General List</a>
        <a href="stats.html" class="nav-link">📊 Statistics</a>
        <a href="settings.html" class="nav-link">⚙️ Settings</a>
        <a href="trash.html" class="nav-link active">🗑️ Trash Bin</a>
    </aside>

    <main id="main-content">
        <section id="view-area">
            <h1>Trash Bin</h1>

            <div class="trash-banner">
                Items in the trash bin are permanently deleted after 14 days. Restoring a parent task brings back all its nested sub-tasks.
            </div>

            <div id="trash-list"></div>
        </section>
    </main>

    <script>
        const FOURTEEN_DAYS_MS = 14 * 24 * 60 * 60 * 1000;

        const toggleBtn = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('backdrop');
        const trashList = document.getElementById('trash-list');

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.warn('ServiceWorker registration failed: ', err);
                });
            });
        }

        toggleBtn.addEventListener('click', () => {
            const isOpen = sidebar.classList.toggle('open');
            backdrop.classList.toggle('active', isOpen);
        });

        backdrop.addEventListener('click', () => {
            sidebar.classList.remove('open');
            backdrop.classList.remove('active');
        });

        function getTasks() {
            return JSON.parse(localStorage.getItem('taskitator_tasks')) || [];
        }

        function saveTasks(tasks) {
            localStorage.setItem('taskitator_tasks', JSON.stringify(tasks));
        }

        function getSettings() {
            return JSON.parse(localStorage.getItem('taskitator_settings')) || {
                weekendDays: [5, 6],
                tags: []
            };
        }

        function purgeExpiredTasks() {
            const now = Date.now();
            const tasks = getTasks();
            const cleanTasks = tasks.filter(task => {
                if (task.status !== 'trashed') return true;
                const trashedTime = task.trashed_at ? new Date(task.trashed_at).getTime() : now;
                return (now - trashedTime) < FOURTEEN_DAYS_MS;
            });

            if (cleanTasks.length !== tasks.length) {
                saveTasks(cleanTasks);
            }
        }

        function getDescendantIds(parentId, allTasks) {
            let descendants = [];
            const children = allTasks.filter(t => t.parent_id === parentId);
            children.forEach(child => {
                descendants.push(child.id);
                descendants = descendants.concat(getDescendantIds(child.id, allTasks));
            });
            return descendants;
        }

        function processDailyLoginRoutine() {
            const todayStr = new Date().toISOString().split('T')[0];
            const lastLogin = localStorage.getItem('taskitator_last_login');
            const settings = getSettings();
            const todayDayOfWeek = new Date().getDay();

            let tasks = getTasks();
            let changed = false;

            if (lastLogin !== todayStr) {
                tasks.forEach(task => {
                    if (!task.is_recurring || task.status === 'trashed') return;
                    if (task.status === 'completed') {
                        let shouldSpawn = false;
                        const rule = task.recurrence_rule || 'daily';
                        const completedDate = task.completed_at ? new Date(task.completed_at) : new Date(0);
                        const daysDiff = (Date.now() - completedDate.getTime()) / (1000 * 60 * 60 * 24);

                        if (rule === 'daily') {
                            shouldSpawn = true;
                        } else if (rule === 'weekdays') {
                            const isWeekend = (settings.weekendDays || [5, 6]).includes(todayDayOfWeek);
                            if (!isWeekend) shouldSpawn = true;
                        } else if (rule === 'weekly') {
                            if (daysDiff >= 7) shouldSpawn = true;
                        } else if (rule === 'monthly') {
                            if (daysDiff >= 30) shouldSpawn = true;
                        }

                        if (shouldSpawn) {
                            task.status = 'active';
                            task.due_date = 'today';
                            task.completed_at = null;

                            const descendantIds = new Set(getDescendantIds(task.id, tasks));
                            tasks.forEach(dt => {
                                if (descendantIds.has(dt.id) && dt.status !== 'trashed') {
                                    dt.status = 'active';
                                    dt.completed_at = null;
                                }
                            });

                            changed = true;
                        }
                    }
                });

                localStorage.setItem('taskitator_last_login', todayStr);
                if (changed) saveTasks(tasks);
            }
        }

        function formatRemainingTime(trashedAtIso) {
            const trashedTime = new Date(trashedAtIso).getTime();
            const expiresAt = trashedTime + FOURTEEN_DAYS_MS;
            const remainingMs = expiresAt - Date.now();

            if (remainingMs <= 0) return 'Expiring soon';

            const days = Math.floor(remainingMs / (1000 * 60 * 60 * 24));
            const hours = Math.floor((remainingMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

            return `${days}d ${hours}h remaining`;
        }

        function renderTrash() {
            const allTasks = getTasks();
            const trashedTasks = allTasks.filter(t => t.status === 'trashed');

            trashList.innerHTML = '';

            if (trashedTasks.length === 0) {
                trashList.innerHTML = '<p style="color: #64748b; font-size: 0.9rem; margin-top: 20px;">Trash bin is empty.</p>';
                return;
            }

            trashedTasks.forEach(task => {
                const card = document.createElement('div');
                card.className = 'trash-card';

                const countdownText = task.trashed_at 
                    ? formatRemainingTime(task.trashed_at) 
                    : '14d 0h remaining';

                card.innerHTML = `
                    <div style="flex-grow: 1;">
                        <div style="font-weight: 500; font-size: 0.95rem;">${escapeHtml(task.title)}</div>
                        <div class="trash-countdown">⏳ ${countdownText}</div>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn-restore" data-id="${task.id}">Restore</button>
                        <button class="btn-purge" data-id="${task.id}">Delete</button>
                    </div>
                `;

                card.querySelector('.btn-restore').addEventListener('click', () => {
                    restoreTask(task.id);
                });

                card.querySelector('.btn-purge').addEventListener('click', () => {
                    hardPurgeTask(task.id);
                });

                trashList.appendChild(card);
            });
        }

        function restoreTask(taskId) {
            const tasks = getTasks();
            const targetIds = new Set([taskId, ...getDescendantIds(taskId, tasks)]);

            tasks.forEach(t => {
                if (targetIds.has(t.id)) {
                    t.status = 'active';
                    t.trashed_at = null;
                }
            });

            saveTasks(tasks);
            renderTrash();
        }

        function hardPurgeTask(taskId) {
            const tasks = getTasks();
            const targetIds = new Set([taskId, ...getDescendantIds(taskId, tasks)]);
            const remainingTasks = tasks.filter(t => !targetIds.has(t.id));

            saveTasks(remainingTasks);
            renderTrash();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        purgeExpiredTasks();
        processDailyLoginRoutine();
        renderTrash();
    </script>
</body>
</html>
