<!-- trash.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskitator - Trash</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .trash-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .trash-title {
            font-size: 0.95rem;
            color: var(--text-color);
            word-break: break-word;
        }
        .trash-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .trash-actions {
            display: flex;
            gap: 8px;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-danger:hover {
            background: var(--danger-hover);
        }
    </style>
</head>
<body>

<!-- Sidebar Drawer -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="sidebar-drawer" id="sidebarDrawer">
    <div style="font-weight: 700; font-size: 1.15rem; margin-bottom: 24px;">Taskitator</div>
    <nav class="drawer-links">
        <a href="index.html">📅 Today</a>
        <a href="general.html">🗂️ General Tasks</a>
        <a href="stats.html">📊 Stats</a>
        <a href="trash.html" class="active">🗑️ Trash</a>
        <a href="settings.html">⚙️ Settings</a>
    </nav>
</aside>

<div class="app-container">
    <!-- Top Navbar -->
    <header class="top-navbar">
        <div class="nav-left">
            <button class="icon-btn" id="openDrawerBtn" title="Menu">☰</button>
            <h2 style="margin: 0; font-size: 1.25rem;">Trash</h2>
        </div>
        <div class="nav-right">
            <button class="btn-danger" id="emptyTrashBtn">Empty Trash</button>
        </div>
    </header>

    <ul class="task-list-tree" id="trashList"></ul>
</div>

<script src="sync-engine.js"></script>
<script>
const TASKS_KEY = 'taskitator_tasks';
let tasks = [];

function loadTasks() {
    try {
        tasks = JSON.parse(localStorage.getItem(TASKS_KEY) || '[]');
    } catch (e) {
        tasks = [];
    }
}

function saveTasksAndPush() {
    localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
    if (window.SyncEngine && typeof SyncEngine.scheduleAutoPush === 'function') {
        SyncEngine.scheduleAutoPush(45000);
    }
}

function renderTrash() {
    const list = document.getElementById('trashList');
    list.innerHTML = '';

    const trashedTasks = tasks.filter(t => t.status === 'trash');

    if (trashedTasks.length === 0) {
        list.innerHTML = '<li style="text-align: center; color: var(--text-muted); padding: 32px;">Trash is empty.</li>';
        return;
    }

    trashedTasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'trash-item';

        const info = document.createElement('div');
        info.innerHTML = `
            <div class="trash-title">${task.title} ${task.ai_locked ? '<span class="ai-badge">🔒 AI</span>' : ''}</div>
            <div class="trash-meta">Created: ${new Date(task.created_at || Date.now()).toLocaleDateString()}</div>
        `;

        const actions = document.createElement('div');
        actions.className = 'trash-actions';

        const restoreBtn = document.createElement('button');
        restoreBtn.className = 'icon-btn';
        restoreBtn.textContent = 'Restore';
        restoreBtn.addEventListener('click', () => restoreTask(task.id));

        const permDelBtn = document.createElement('button');
        permDelBtn.className = 'icon-btn';
        permDelBtn.style.color = 'var(--danger)';
        permDelBtn.style.borderColor = '#fca5a5';
        permDelBtn.textContent = 'Delete Forever';
        permDelBtn.addEventListener('click', () => permanentlyDeleteTask(task.id));

        actions.appendChild(restoreBtn);
        actions.appendChild(permDelBtn);

        li.appendChild(info);
        li.appendChild(actions);
        list.appendChild(li);
    });
}

function restoreTask(taskId) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    task.status = 'active';
    saveTasksAndPush();
    renderTrash();
}

function permanentlyDeleteTask(taskId) {
    if (!confirm('Permanently delete this task? This cannot be undone.')) return;
    tasks = tasks.filter(t => t.id !== taskId);
    saveTasksAndPush();
    renderTrash();
}

document.getElementById('emptyTrashBtn').addEventListener('click', () => {
    const count = tasks.filter(t => t.status === 'trash').length;
    if (count === 0) {
        alert('Trash is already empty.');
        return;
    }
    if (confirm(`Permanently delete all ${count} items in the trash?`)) {
        tasks = tasks.filter(t => t.status !== 'trash');
        saveTasksAndPush();
        renderTrash();
    }
});

// Drawer Navigation
const sidebarDrawer = document.getElementById('sidebarDrawer');
const drawerBackdrop = document.getElementById('drawerBackdrop');

document.getElementById('openDrawerBtn').addEventListener('click', () => {
    sidebarDrawer.classList.add('open');
    drawerBackdrop.classList.add('open');
});

drawerBackdrop.addEventListener('click', () => {
    sidebarDrawer.classList.remove('open');
    drawerBackdrop.classList.remove('open');
});

document.addEventListener('DOMContentLoaded', () => {
    loadTasks();
    renderTrash();
});
</script>
</body>
</html>
