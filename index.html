<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taskitator - Today</title>
    <link rel="stylesheet" href="style.css?v=7">
</head>
<body>

    <div id="backdrop"></div>

    <!-- Mobile Sticky Header -->
    <div id="mobile-header">
        <h2>Taskitator</h2>
        <button id="menu-toggle" aria-label="Toggle navigation">☰</button>
    </div>

    <!-- Sidebar Drawer -->
    <aside id="sidebar">
        <h2>Taskitator</h2>
        <a href="index.html" class="nav-link active">📅 Today's Tasks</a>
        <a href="general.html" class="nav-link">📋 General List</a>
        <a href="stats.html" class="nav-link">📊 Statistics</a>
        <a href="settings.html" class="nav-link">⚙️ Settings</a>
        <a href="trash.html" class="nav-link">🗑️ Trash Bin</a>
    </aside>

    <!-- Main Workspace -->
    <main id="main-content">
        <header id="top-nav">
            <a href="#" class="tab-link active">All Today</a>
            <a href="#" class="tab-link">Priority</a>
            <a href="#" class="tab-link">Tags</a>
        </header>

        <section id="view-area">
            <h1>Today's To-Do List</h1>

            <form id="add-task-form" class="add-task-bar">
                <input type="text" id="task-title-input" class="task-input" placeholder="Add a new root task..." required maxlength="80">
                <button type="submit" class="add-btn">+</button>
            </form>

            <div id="task-list"></div>
        </section>
    </main>

    <!-- Task Details Modal -->
    <div id="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Task Details</h3>
                <button class="close-modal-btn" id="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <p id="modal-desc">Description</p>
                <div class="task-meta" id="modal-meta"></div>

                <!-- Sub-tasks Section inside Modal -->
                <div class="modal-subtasks-section">
                    <h4>Direct Sub-Tasks</h4>
                    <div id="modal-subtasks-list"></div>
                    <form id="modal-subtask-form" class="modal-subtask-form">
                        <input type="text" id="subtask-input" class="modal-subtask-input" placeholder="Add a direct sub-task..." required maxlength="80">
                        <button type="submit" class="modal-subtask-add-btn">+</button>
                    </form>
                </div>
            </div>
            <div class="modal-actions">
                <button class="trash-btn" id="trash-task-btn">Trash Task</button>
            </div>
        </div>
    </div>

    <script>
        const FOURTEEN_DAYS_MS = 14 * 24 * 60 * 60 * 1000;

        const toggleBtn = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('backdrop');
        const taskForm = document.getElementById('add-task-form');
        const taskInput = document.getElementById('task-title-input');
        const taskList = document.getElementById('task-list');

        const modalOverlay = document.getElementById('modal-overlay');
        const closeModalBtn = document.getElementById('close-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalMeta = document.getElementById('modal-meta');
        const modalSubtasksList = document.getElementById('modal-subtasks-list');
        const modalSubtaskForm = document.getElementById('modal-subtask-form');
        const subtaskInput = document.getElementById('subtask-input');
        const trashTaskBtn = document.getElementById('trash-task-btn');

        let activeTaskId = null;

        // Mobile Nav Drawer Toggle
        toggleBtn.addEventListener('click', () => {
            const isOpen = sidebar.classList.toggle('open');
            backdrop.classList.toggle('active', isOpen);
        });

        backdrop.addEventListener('click', () => {
            sidebar.classList.remove('open');
            backdrop.classList.remove('active');
        });

        // Local Storage Access
        function getTasks() {
            return JSON.parse(localStorage.getItem('taskitator_tasks')) || [];
        }

        function saveTasks(tasks) {
            localStorage.setItem('taskitator_tasks', JSON.stringify(tasks));
        }

        // Auto-purge any trashed tasks older than 14 days
        function purgeExpiredTasks() {
            const now = Date.now();
            const tasks = getTasks();
            const cleanTasks = tasks.filter(task => {
                if (task.status !== 'trashed') return true;
                const trashedTime = task.trashed_at ? new Date(task.trashed_at).getTime() : now;
                return (now - trashedTime) < FOURTEEN_DAYS_MS;
            });

            if (cleanTasks.length !== tasks.length) {
                saveTasks(cleanTasks);
            }
        }

        // Descendant ID Resolver
        function getDescendantIds(parentId, allTasks) {
            let descendants = [];
            const children = allTasks.filter(t => t.parent_id === parentId);
            children.forEach(child => {
                descendants.push(child.id);
                descendants = descendants.concat(getDescendantIds(child.id, allTasks));
            });
            return descendants;
        }

        // Render Indented Tree
        function renderTasks() {
            const allTasks = getTasks();
            const activeTasks = allTasks.filter(t => t.status === 'active');
            taskList.innerHTML = '';

            if (activeTasks.length === 0) {
                taskList.innerHTML = '<p style="color: #64748b; font-size: 0.9rem; margin-top: 20px;">No tasks for today. Tap above to add one.</p>';
                return;
            }

            function appendTaskTree(parentId, depth) {
                const children = activeTasks.filter(t => t.parent_id === parentId);
                children.forEach(task => {
                    const card = createTaskCard(task, depth, allTasks);
                    taskList.appendChild(card);
                    appendTaskTree(task.id, depth + 1);
                });
            }

            // Start with root tasks
            appendTaskTree(null, 0);
        }

        // Task Card Builder
        function createTaskCard(task, depth, allTasks) {
            const card = document.createElement('div');
            const safeDepth = Math.min(depth, 3);
            card.className = `task-card depth-${safeDepth}`;
            card.dataset.id = task.id;

            const directSubtasks = allTasks.filter(t => t.parent_id === task.id && t.status !== 'trashed');
            const completedCount = directSubtasks.filter(t => t.status === 'completed').length;
            const subtaskBadge = directSubtasks.length > 0 
                ? `<span class="subtask-badge">${completedCount}/${directSubtasks.length} subtasks</span>` 
                : '';

            const priorityClass = task.priority ? `badge-priority-${task.priority}` : '';

            card.innerHTML = `
                <div class="check-circle" data-action="complete"></div>
                <div class="task-info">
                    <div class="task-title">${escapeHtml(task.title)}</div>
                    <div class="task-desc">${escapeHtml(task.description || 'No description')}</div>
                    <div class="task-meta">
                        <span class="badge ${priorityClass}">${task.priority || 'Normal'}</span>
                        <span class="due-badge">${task.due_date || 'Today'}</span>
                        ${subtaskBadge}
                    </div>
                </div>
            `;

            card.addEventListener('click', (e) => {
                if (e.target.dataset.action === 'complete') {
                    triggerComplete(task.id, card);
                } else {
                    openModal(task.id);
                }
            });

            return card;
        }

        // Cascading Completion
        function triggerComplete(taskId, element) {
            element.classList.add('completing');
            setTimeout(() => {
                const tasks = getTasks();
                const targetIds = new Set([taskId, ...getDescendantIds(taskId, tasks)]);

                tasks.forEach(t => {
                    if (targetIds.has(t.id)) {
                        t.status = 'completed';
                    }
                });

                saveTasks(tasks);
                renderTasks();
            }, 350);
        }

        // Cascading Trash with 14-day timestamp
        trashTaskBtn.addEventListener('click', () => {
            if (!activeTaskId) return;
            const tasks = getTasks();
            const targetIds = new Set([activeTaskId, ...getDescendantIds(activeTaskId, tasks)]);
            const timestamp = new Date().toISOString();

            tasks.forEach(t => {
                if (targetIds.has(t.id)) {
                    t.status = 'trashed';
                    t.trashed_at = timestamp;
                }
            });

            saveTasks(tasks);
            closeModal();
            renderTasks();
        });

        // Modal Controls
        function openModal(taskId) {
            activeTaskId = taskId;
            const tasks = getTasks();
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            modalTitle.textContent = task.title;
            modalDesc.textContent = task.description || 'No description provided.';
            modalMeta.innerHTML = `
                <span class="badge badge-priority-${task.priority || 'low'}">${task.priority || 'Normal'}</span>
                <span class="due-badge">Due: ${task.due_date || 'Today'}</span>
            `;

            renderModalSubtasks(task.id, tasks);
            modalOverlay.classList.add('active');
        }

        function renderModalSubtasks(parentId, allTasks) {
            modalSubtasksList.innerHTML = '';
            const subtasks = allTasks.filter(t => t.parent_id === parentId && t.status !== 'trashed');

            if (subtasks.length === 0) {
                modalSubtasksList.innerHTML = '<p style="color: #64748b; font-size: 0.8rem;">No sub-tasks yet.</p>';
                return;
            }

            subtasks.forEach(st => {
                const item = document.createElement('div');
                item.className = 'modal-subtask-item';
                const statusIcon = st.status === 'completed' ? '✓' : '○';
                item.innerHTML = `
                    <span>${statusIcon} ${escapeHtml(st.title)}</span>
                    <span style="color: #64748b; font-size: 0.75rem;">${st.status}</span>
                `;
                modalSubtasksList.appendChild(item);
            });
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            activeTaskId = null;
        }

        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // Add Sub-Task via Modal
        modalSubtaskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = subtaskInput.value.trim();
            if (!title || !activeTaskId) return;

            const newSubtask = {
                id: Date.now().toString(),
                parent_id: activeTaskId,
                title: title,
                description: '',
                priority: 'med',
                due_date: 'today',
                status: 'active'
            };

            const tasks = getTasks();
            tasks.push(newSubtask);
            saveTasks(tasks);

            subtaskInput.value = '';
            renderModalSubtasks(activeTaskId, tasks);
            renderTasks();
        });

        // Add Root Task
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = taskInput.value.trim();
            if (!title) return;

            const newTask = {
                id: Date.now().toString(),
                parent_id: null,
                title: title,
                description: '',
                priority: 'med',
                due_date: 'today',
                status: 'active'
            };

            const tasks = getTasks();
            tasks.unshift(newTask);
            saveTasks(tasks);
            taskInput.value = '';
            renderTasks();
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Run auto-purge check before initial render
        purgeExpiredTasks();
        renderTasks();
    </script>
</body>
</html>
