<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskitator - Today</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Mobile-Only Header -->
    <div id="mobile-header">
        <h2>Taskitator</h2>
        <button id="menu-toggle" aria-label="Toggle navigation">☰</button>
    </div>

    <!-- Sidebar (Drawer on mobile) -->
    <aside id="sidebar">
        <h2>Taskitator</h2>
        <a href="index.html" class="nav-link active">📅 Today's Tasks</a>
        <a href="general.html" class="nav-link">📋 General List</a>
        <a href="stats.html" class="nav-link">📊 Statistics</a>
        <a href="settings.html" class="nav-link">⚙️ Settings</a>
        <a href="trash.html" class="nav-link">🗑️ Trash Bin</a>
    </aside>

    <!-- Main Workspace -->
    <main id="main-content">
        <!-- Top Navigation Header -->
        <header id="top-nav">
            <a href="#" class="tab-link active">All Today</a>
            <a href="#" class="tab-link">Priority</a>
            <a href="#" class="tab-link">Tags</a>
        </header>

        <!-- View Body -->
        <section id="view-area">
            <h1>Today's To-Do List</h1>

            <div class="task-card">
                <div class="check-circle"></div>
                <div class="task-info">
                    <div class="task-title">Finish Phase 1 Setup</div>
                    <div class="task-desc">This long description will cleanly cut off with an ellipsis without creating any horizontal scroll on your phone screen.</div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const toggleBtn = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

        // Close drawer when clicking outside on mobile
        document.addEventListener('click', (e) => {
            if (!sidebar.contains(e.target) && !toggleBtn.contains(e.target)) {
                sidebar.classList.remove('open');
            }
        });
    </script>
</body>
</html>
