<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taskitator - Today</title>
    <link rel="stylesheet" href="style.css?v=11">
</head>
<body>

    <div id="backdrop"></div>

    <!-- Mobile Header -->
    <div id="mobile-header">
        <h2>Taskitator</h2>
        <button id="menu-toggle" aria-label="Toggle navigation">☰</button>
    </div>

    <!-- Sidebar Drawer -->
    <aside id="sidebar">
        <h2>Taskitator</h2>
        <a href="index.html" class="nav-link active">📅 Today's Tasks</a>
        <a href="general.html" class="nav-link">📋 General List</a>
        <a href="stats.html" class="nav-link">📊 Statistics</a>
        <a href="settings.html" class="nav-link">⚙️ Settings</a>
        <a href="trash.html" class="nav-link">🗑️ Trash Bin</a>
    </aside>

    <!-- Main Workspace -->
    <main id="main-content">
        <header id="top-nav">
            <a href="#" class="tab-link active">All Today</a>
            <a href="#" class="tab-link">Priority</a>
            <a href="#" class="tab-link">Tags</a>
        </header>

        <section id="view-area">
            <h1>Today's To-Do List</h1>

            <form id="add-task-form" class="add-task-bar">
                <input type="text" id="task-title-input" class="task-input" placeholder="Add a new root task..." required maxlength="80">
                <button type="submit" class="add-btn">+</button>
            </form>

            <div id="task-list"></div>
        </section>
    </main>

    <!-- Task Details & Parameter Edit Modal -->
    <div id="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-heading">Edit Task</h3>
                <button class="close-modal-btn" id="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Title Edit -->
                <div class="modal-edit-field">
                    <label class="modal-label" for="edit-title">Title</label>
                    <input type="text" id="edit-title" class="modal-input" maxlength="80" required>
                </div>

                <!-- Description Edit -->
                <div class="modal-edit-field">
                    <label class="modal-label" for="edit-desc">Description</label>
                    <textarea id="edit-desc" class="modal-textarea" rows="2" placeholder="Add details..."></textarea>
                </div>

                <!-- Priority & Due Date Row -->
                <div class="modal-row">
                    <div class="modal-edit-field">
                        <label class="modal-label" for="edit-priority">Priority</label>
                        <select id="edit-priority" class="modal-select">
                            <option value="high">High</option>
                            <option value="med">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                    <div class="modal-edit-field">
                        <label class="modal-label" for="edit-due">Due Date</label>
                        <input type="date" id="edit-due" class="modal-input">
                    </div>
                </div>

                <!-- Tag Picker -->
                <div class="modal-edit-field">
                    <label class="modal-label">Tag</label>
                    <div id="modal-tags" class="modal-tags-wrapper"></div>
                </div>

                <!-- Recurrence Toggle -->
                <div class="modal-field-group">
                    <label class="modal-checkbox-label">
                        <input type="checkbox" id="modal-recur-checkbox">
                        Repeat this task
                    </label>
                    <select id="modal-recur-rule" class="modal-recurrence-select" style="display: none;">
                        <option value="daily">Every Day</option>
                        <option value="weekdays">Weekdays Only (Skips Weekend)</option>
                        <option value="weekly">Once a Week</option>
                    </select>
                </div>

                <!-- Sub-tasks Section -->
                <div class="modal-subtasks-section">
                    <h4>Direct Sub-Tasks</h4>
                    <div id="modal-subtasks-list"></div>
                    <form id="modal-subtask-form" class="modal-subtask-form">
                        <input type="text" id="subtask-input" class="modal-subtask-input" placeholder="Add a direct sub-task..." required maxlength="80">
                        <button type="submit" class="modal-subtask-add-btn">+</button>
                    </form>
                </div>
            </div>
            <div class="modal-actions">
                <button class="trash-btn" id="trash-task-btn">Trash Task</button>
            </div>
        </div>
    </div>

    <script>
        const FOURTEEN_DAYS_MS = 14 * 24 * 60 * 60 * 1000;

        const toggleBtn = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('backdrop');
        const taskForm = document.getElementById('add-task-form');
        const taskInput = document.getElementById('task-title-input');
        const taskList = document.getElementById('task-list');

        const modalOverlay = document.getElementById('modal-overlay');
        const closeModalBtn = document.getElementById('close-modal');
        const editTitle = document.getElementById('edit-title');
        const editDesc = document.getElementById('edit-desc');
        const editPriority = document.getElementById('edit-priority');
        const editDue = document.getElementById('edit-due');
        const modalTags = document.getElementById('modal-tags');
        const modalRecurCheckbox = document.getElementById('modal-recur-checkbox');
        const modalRecurRule = document.getElementById('modal-recur-rule');

        const modalSubtasksList = document.getElementById('modal-subtasks-list');
        const modalSubtaskForm = document.getElementById('modal-subtask-form');
        const subtaskInput = document.getElementById('subtask-input');
        const trashTaskBtn = document.getElementById('trash-task-btn');

        let activeTaskId = null;

        // Mobile Nav Drawer Toggle
        toggleBtn.addEventListener('click', () => {
            const isOpen = sidebar.classList.toggle('open');
            backdrop.classList.toggle('active', isOpen);
        });

        backdrop.addEventListener('click', () => {
            sidebar.classList.remove('open');
            backdrop.classList.remove('active');
        });

        // Local Storage Utilities
        function getTasks() {
            return JSON.parse(localStorage.getItem('taskitator_tasks')) || [];
        }

        function saveTasks(tasks) {
            localStorage.setItem('taskitator_tasks', JSON.stringify(tasks));
        }

        function getSettings() {
            return JSON.parse(localStorage.getItem('taskitator_settings')) || {
                weekendDays: [5, 6],
                tags: [
                    { id: '1', name: 'Work', color: '#0284c7' },
                    { id: '2', name: 'Personal', color: '#10b981' },
                    { id: '3', name: 'Urgent', color: '#ef4444' }
                ]
            };
        }

        function purgeExpiredTasks() {
            const now = Date.now();
            const tasks = getTasks();
            const cleanTasks = tasks.filter(task => {
                if (task.status !== 'trashed') return true;
                const trashedTime = task.trashed_at ? new Date(task.trashed_at).getTime() : now;
                return (now - trashedTime) < FOURTEEN_DAYS_MS;
            });

            if (cleanTasks.length !== tasks.length) {
                saveTasks(cleanTasks);
            }
        }

        function processDailyLoginRoutine() {
            const todayStr = new Date().toISOString().split('T')[0];
            const lastLogin = localStorage.getItem('taskitator_last_login');
            const settings = getSettings();
            const todayDayOfWeek = new Date().getDay();

            let tasks = getTasks();
            let changed = false;

            if (lastLogin !== todayStr) {
                tasks.forEach(task => {
                    if (!task.is_recurring || task.status === 'trashed') return;
                    if (task.status === 'completed') {
                        let shouldSpawn = false;
                        const rule = task.recurrence_rule || 'daily';

                        if (rule === 'daily') shouldSpawn = true;
                        else if (rule === 'weekdays') {
                            const isWeekend = (settings.weekendDays || [5, 6]).includes(todayDayOfWeek);
                            if (!isWeekend) shouldSpawn = true;
                        } else if (rule === 'weekly') {
                            const completedDate = task.completed_at ? new Date(task.completed_at) : new Date(0);
                            const daysDiff = (Date.now() - completedDate.getTime()) / (1000 * 60 * 60 * 24);
                            if (daysDiff >= 7) shouldSpawn = true;
                        }

                        if (shouldSpawn) {
                            task.status = 'active';
                            task.due_date = 'today';
                            task.completed_at = null;
                            changed = true;
                        }
                    }
                });

                localStorage.setItem('taskitator_last_login', todayStr);
                if (changed) saveTasks(tasks);
            }
        }

        function getDescendantIds(parentId, allTasks) {
            let descendants = [];
            const children = allTasks.filter(t => t.parent_id === parentId);
            children.forEach(child => {
                descendants.push(child.id);
                descendants = descendants.concat(getDescendantIds(child.id, allTasks));
            });
            return descendants;
        }

        // Render Task Hierarchy
        function renderTasks() {
            const allTasks = getTasks();
            const activeTasks = allTasks.filter(t => t.status === 'active');
            taskList.innerHTML = '';

            if (activeTasks.length === 0) {
                taskList.innerHTML = '<p style="color: #64748b; font-size: 0.9rem; margin-top: 20px;">No tasks for today. Tap above to add one.</p>';
                return;
            }

            function appendTaskTree(parentId, depth) {
                const children = activeTasks.filter(t => t.parent_id === parentId);
                children.forEach(task => {
                    const card = createTaskCard(task, depth, allTasks);
                    taskList.appendChild(card);
                    appendTaskTree(task.id, depth + 1);
                });
            }

            appendTaskTree(null, 0);
        }

        function createTaskCard(task, depth, allTasks) {
            const card = document.createElement('div');
            const safeDepth = Math.min(depth, 3);
            card.className = `task-card depth-${safeDepth}`;
            card.dataset.id = task.id;

            const directSubtasks = allTasks.filter(t => t.parent_id === task.id && t.status !== 'trashed');
            const completedCount = directSubtasks.filter(t => t.status === 'completed').length;
            const subtaskBadge = directSubtasks.length > 0 
                ? `<span class="subtask-badge">${completedCount}/${directSubtasks.length} subtasks</span>` 
                : '';

            const recurringBadge = task.is_recurring 
                ? `<span class="badge-recurring">🔁 ${escapeHtml(task.recurrence_rule || 'daily')}</span>` 
                : '';

            const priorityClass = task.priority ? `badge-priority-${task.priority}` : '';

            // Resolve Tag Appearance
            const settings = getSettings();
            const tagObj = (settings.tags || []).find(t => t.name === task.tag);
            const tagBadge = tagObj 
                ? `<span class="badge" style="background-color: ${tagObj.color}; color: #ffffff;">${escapeHtml(tagObj.name)}</span>` 
                : (task.tag ? `<span class="badge">${escapeHtml(task.tag)}</span>` : '');

            card.innerHTML = `
                <div class="check-circle" data-action="complete"></div>
                <div class="task-info">
                    <div class="task-title">${escapeHtml(task.title)}</div>
                    <div class="task-desc">${escapeHtml(task.description || 'No description')}</div>
                    <div class="task-meta">
                        <span class="badge ${priorityClass}">${task.priority || 'Normal'}</span>
                        <span class="due-badge">${task.due_date || 'Today'}</span>
                        ${tagBadge}
                        ${recurringBadge}
                        ${subtaskBadge}
                    </div>
                </div>
            `;

            card.addEventListener('click', (e) => {
                if (e.target.dataset.action === 'complete') {
                    triggerComplete(task.id, card);
                } else {
                    openModal(task.id);
                }
            });

            return card;
        }

        function triggerComplete(taskId, element) {
            element.classList.add('completing');
            setTimeout(() => {
                const tasks = getTasks();
                const targetIds = new Set([taskId, ...getDescendantIds(taskId, tasks)]);
                const nowIso = new Date().toISOString();

                tasks.forEach(t => {
                    if (targetIds.has(t.id)) {
                        t.status = 'completed';
                        t.completed_at = nowIso;
                    }
                });

                saveTasks(tasks);
                renderTasks();
            }, 350);
        }

        trashTaskBtn.addEventListener('click', () => {
            if (!activeTaskId) return;
            const tasks = getTasks();
            const targetIds = new Set([activeTaskId, ...getDescendantIds(activeTaskId, tasks)]);
            const timestamp = new Date().toISOString();

            tasks.forEach(t => {
                if (targetIds.has(t.id)) {
                    t.status = 'trashed';
                    t.trashed_at = timestamp;
                }
            });

            saveTasks(tasks);
            closeModal();
            renderTasks();
        });

        // ==========================================
        // PHASE 9: INTERACTIVE MODAL EDITING
        // ==========================================
        function openModal(taskId) {
            activeTaskId = taskId;
            const tasks = getTasks();
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            // Load Values into Form
            editTitle.value = task.title || '';
            editDesc.value = task.description || '';
            editPriority.value = task.priority || 'med';
            editDue.value = (task.due_date && task.due_date !== 'today') ? task.due_date : '';

            // Load Recurrence
            modalRecurCheckbox.checked = !!task.is_recurring;
            modalRecurRule.style.display = task.is_recurring ? 'block' : 'none';
            modalRecurRule.value = task.recurrence_rule || 'daily';

            // Load Tag Selector Chips
            renderModalTagPicker(task.tag);

            renderModalSubtasks(task.id, tasks);
            modalOverlay.classList.add('active');
        }

        function renderModalTagPicker(selectedTag) {
            modalTags.innerHTML = '';
            const settings = getSettings();
            const tags = settings.tags || [];

            if (tags.length === 0) {
                modalTags.innerHTML = '<span style="color: #64748b; font-size: 0.8rem;">No tags created in Settings.</span>';
                return;
            }

            tags.forEach(tag => {
                const chip = document.createElement('span');
                chip.className = `modal-tag-chip ${selectedTag === tag.name ? 'active' : ''}`;
                chip.style.backgroundColor = tag.color;
                chip.style.color = '#ffffff';
                chip.textContent = tag.name;

                chip.addEventListener('click', () => {
                    const tasks = getTasks();
                    const task = tasks.find(t => t.id === activeTaskId);
                    if (!task) return;

                    // Toggle selection: unselect if tapped again
                    if (task.tag === tag.name) {
                        task.tag = null;
                    } else {
                        task.tag = tag.name;
                    }

                    saveTasks(tasks);
                    renderModalTagPicker(task.tag);
                    renderTasks();
                });

                modalTags.appendChild(chip);
            });
        }

        // Live Auto-Save on Modal Input Changes
        function handleModalFieldChange() {
            if (!activeTaskId) return;
            const tasks = getTasks();
            const task = tasks.find(t => t.id === activeTaskId);
            if (!task) return;

            task.title = editTitle.value.trim() || 'Untitled Task';
            task.description = editDesc.value.trim();
            task.priority = editPriority.value;
            task.due_date = editDue.value || 'today';
            task.is_recurring = modalRecurCheckbox.checked;
            task.recurrence_rule = modalRecurCheckbox.checked ? modalRecurRule.value : null;

            saveTasks(tasks);
            renderTasks();
        }

        editTitle.addEventListener('input', handleModalFieldChange);
        editDesc.addEventListener('input', handleModalFieldChange);
        editPriority.addEventListener('change', handleModalFieldChange);
        editDue.addEventListener('change', handleModalFieldChange);

        modalRecurCheckbox.addEventListener('change', () => {
            modalRecurRule.style.display = modalRecurCheckbox.checked ? 'block' : 'none';
            handleModalFieldChange();
        });

        modalRecurRule.addEventListener('change', handleModalFieldChange);

        function renderModalSubtasks(parentId, allTasks) {
            modalSubtasksList.innerHTML = '';
            const subtasks = allTasks.filter(t => t.parent_id === parentId && t.status !== 'trashed');

            if (subtasks.length === 0) {
                modalSubtasksList.innerHTML = '<p style="color: #64748b; font-size: 0.8rem;">No sub-tasks yet.</p>';
                return;
            }

            subtasks.forEach(st => {
                const item = document.createElement('div');
                item.className = 'modal-subtask-item';
                const statusIcon = st.status === 'completed' ? '✓' : '○';
                item.innerHTML = `
                    <span>${statusIcon} ${escapeHtml(st.title)}</span>
                    <span style="color: #64748b; font-size: 0.75rem;">${st.status}</span>
                `;
                modalSubtasksList.appendChild(item);
            });
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            activeTaskId = null;
        }

        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // Add Direct Sub-Task
        modalSubtaskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = subtaskInput.value.trim();
            if (!title || !activeTaskId) return;

            const newSubtask = {
                id: Date.now().toString(),
                parent_id: activeTaskId,
                title: title,
                description: '',
                priority: 'med',
                due_date: 'today',
                status: 'active',
                is_recurring: false,
                recurrence_rule: null
            };

            const tasks = getTasks();
            tasks.push(newSubtask);
            saveTasks(tasks);

            subtaskInput.value = '';
            renderModalSubtasks(activeTaskId, tasks);
            renderTasks();
        });

        // Add Root Task
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = taskInput.value.trim();
            if (!title) return;

            const newTask = {
                id: Date.now().toString(),
                parent_id: null,
                title: title,
                description: '',
                priority: 'med',
                due_date: 'today',
                status: 'active',
                is_recurring: false,
                recurrence_rule: null
            };

            const tasks = getTasks();
            tasks.unshift(newTask);
            saveTasks(tasks);
            taskInput.value = '';
            renderTasks();
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        purgeExpiredTasks();
        processDailyLoginRoutine();
        renderTasks();
    </script>
</body>
</html>
