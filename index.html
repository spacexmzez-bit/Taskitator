<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taskitator - Today</title>
    <!-- The ?v=2 forces your phone to load the fresh CSS -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

    <!-- Dimmed screen overlay for mobile -->
    <div id="backdrop"></div>

    <!-- Mobile-Only Sticky Header -->
    <div id="mobile-header">
        <h2>Taskitator</h2>
        <button id="menu-toggle" aria-label="Toggle navigation">☰</button>
    </div>

    <!-- Slide-out Sidebar Drawer -->
    <aside id="sidebar">
        <h2>Taskitator</h2>
        <a href="index.html" class="nav-link active">📅 Today's Tasks</a>
        <a href="general.html" class="nav-link">📋 General List</a>
        <a href="stats.html" class="nav-link">📊 Statistics</a>
        <a href="settings.html" class="nav-link">⚙️ Settings</a>
        <a href="trash.html" class="nav-link">🗑️ Trash Bin</a>
    </aside>

    <!-- Main Workspace -->
    <main id="main-content">
        <header id="top-nav">
            <a href="#" class="tab-link active">All Today</a>
            <a href="#" class="tab-link">Priority</a>
            <a href="#" class="tab-link">Tags</a>
        </header>

        <section id="view-area">
            <h1>Today's To-Do List</h1>

            <div class="task-card">
                <div class="check-circle"></div>
                <div class="task-info">
                    <div class="task-title">Finish Phase 1 Setup</div>
                    <div class="task-desc">This long description will cleanly cut off with an ellipsis without causing horizontal scrolling.</div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const toggleBtn = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('backdrop');

        function toggleMenu() {
            const isOpen = sidebar.classList.toggle('open');
            backdrop.classList.toggle('active', isOpen);
        }

        function closeMenu() {
            sidebar.classList.remove('open');
            backdrop.classList.remove('active');
        }

        toggleBtn.addEventListener('click', toggleMenu);
        backdrop.addEventListener('click', closeMenu);
    </script>
</body>
</html>
