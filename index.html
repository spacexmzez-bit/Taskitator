<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskitator - Today</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <style>
        .sync-modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .sync-modal-backdrop.open {
            display: flex;
        }
        .sync-modal-content {
            background: var(--card-bg, #111827);
            border: 1px solid var(--border-color, #1f2937);
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 360px;
            color: var(--text-color, #f9fafb);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<!-- Sidebar Drawer -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="sidebar-drawer" id="sidebarDrawer">
    <div style="font-weight: 800; font-size: 1.25rem; margin-bottom: 24px; color: var(--primary);">Taskitator</div>
    <nav class="drawer-links">
        <a href="index.html" class="active">📅 Today</a>
        <a href="general.html">🗂️ General Tasks</a>
        <a href="stats.html">📊 Stats</a>
        <a href="trash.html">🗑️ Trash</a>
        <a href="settings.html">⚙️ Settings</a>
    </nav>
</aside>

<div class="app-container">
    <!-- Top Navbar -->
    <header class="top-navbar">
        <div class="nav-left">
            <button class="icon-btn" id="openDrawerBtn" title="Menu">☰</button>
            <h2 style="margin: 0; font-size: 1.25rem;">Today's Focus</h2>
        </div>
        <div class="nav-right" style="display: flex; align-items: center; gap: 10px;">
            <!-- Real-time Sync Status Indicator -->
            <button id="syncStatusDot" class="sync-dot-btn local-only" title="Sync Status: Local Only"></button>
            <div id="emergencyBadgeContainer" style="display: flex; align-items: center;"></div>
        </div>
    </header>

    <!-- Break Notification Banner -->
    <div id="activeBreakBanner" class="break-banner" style="display: none;">
        <span>☕ Active Break Interval — Device Unlocked</span>
    </div>

    <!-- Active Task Tree View -->
    <main id="taskListContainer" class="task-list-flow">
        <div style="text-align: center; color: var(--text-muted); margin-top: 40px;">Loading workspace...</div>
    </main>
</div>

<!-- Sync Status & Force Action Modal -->
<div class="sync-modal-backdrop" id="syncModal">
    <div class="sync-modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 style="margin: 0; font-size: 1.1rem; color: var(--primary);">Cloud Sync</h3>
            <button class="icon-btn" id="closeSyncModalBtn" style="padding: 2px 6px;">✕</button>
        </div>
        <p id="syncModalDetailText" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px;">
            Checking status...
        </p>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button class="icon-btn" id="forceSyncNowBtn" style="background: var(--primary); color: #fff; border: none; font-weight: 600; padding: 6px 14px;">Force Sync Now</button>
        </div>
    </div>
</div>

<script src="audit-engine.js"></script>
<script src="sync-engine.js"></script>
<script>
const SETTINGS_KEY = 'taskitator_settings';
const TASKS_KEY = 'taskitator_tasks';

const syncStatusDot = document.getElementById('syncStatusDot');
const syncModal = document.getElementById('syncModal');
const closeSyncModalBtn = document.getElementById('closeSyncModalBtn');
const forceSyncNowBtn = document.getElementById('forceSyncNowBtn');
const syncModalDetailText = document.getElementById('syncModalDetailText');
const taskListContainer = document.getElementById('taskListContainer');

let currentSyncState = 'local-only';
let currentSyncDetail = null;

// =========================================================================
// 1. Task Management & UI Rendering
// =========================================================================
function getTasks() {
    try {
        return JSON.parse(localStorage.getItem(TASKS_KEY) || '[]');
    } catch (e) {
        return [];
    }
}

function saveTasks(tasks, triggerSync = true) {
    localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
    if (triggerSync && window.SyncEngine) {
        updateSyncUI('pending', { message: 'Changes pending auto-sync...' });
        SyncEngine.scheduleAutoPush(45000);
    }
    renderTaskTree();
}

function toggleTaskStatus(taskId) {
    const tasks = getTasks();
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;

    task.status = task.status === 'completed' ? 'active' : 'completed';
    task.completed_at = task.status === 'completed' ? new Date().toISOString() : null;
    saveTasks(tasks);
}

function renderTaskTree() {
    const tasks = getTasks();
    const todayStr = new Date().toISOString().split('T')[0];

    // Filter today's active & completed tasks
    const todayTasks = tasks.filter(t => {
        const due = String(t.due_date || 'today').trim().toLowerCase();
        return due === 'today' || due === todayStr;
    });

    if (todayTasks.length === 0) {
        taskListContainer.innerHTML = `
            <div style="text-align: center; color: var(--text-muted); margin-top: 60px;">
                <p style="font-size: 1.1rem; margin-bottom: 8px;">🎉 No tasks scheduled for today.</p>
                <small>Add tasks in General Tasks or pull updates from cloud.</small>
            </div>
        `;
        return;
    }

    let html = '';
    todayTasks.forEach(task => {
        const isDone = task.status === 'completed';
        html += `
            <div class="task-card ${isDone ? 'completed-card' : ''}" style="margin-bottom: 10px; padding: 12px 14px; background: var(--card-bg, #1e293b); border: 1px solid var(--border-color, #334155); border-radius: 8px; display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 12px; flex: 1;">
                    <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleTaskStatus('${task.id}')" style="width: 18px; height: 18px; cursor: pointer;">
                    <div>
                        <div style="font-weight: 600; text-decoration: ${isDone ? 'line-through' : 'none'}; color: ${isDone ? 'var(--text-muted)' : 'inherit'};">
                            ${task.title || 'Untitled Task'}
                        </div>
                        ${task.proof_criteria ? `<small style="color: var(--text-muted); display: block; font-size: 0.75rem;">Criteria: ${task.proof_criteria}</small>` : ''}
                    </div>
                </div>
                ${task.subtasks && task.subtasks.length > 0 ? `<span class="tag-chip" style="font-size: 0.75rem;">${task.subtasks.filter(s => s.status === 'completed').length}/${task.subtasks.length} Subtasks</span>` : ''}
            </div>
        `;
    });

    taskListContainer.innerHTML = html;
}

// =========================================================================
// 2. Real-Time Cloud Sync Engine Integration
// =========================================================================
function updateSyncUI(status, detail) {
    currentSyncState = status;
    currentSyncDetail = detail;

    syncStatusDot.className = 'sync-dot-btn';

    if (status === 'synced') {
        syncStatusDot.classList.add('synced');
        syncStatusDot.title = 'Sync: All changes saved to cloud';
        syncModalDetailText.innerHTML = `<strong>Status:</strong> Synced<br><small>Last synced: ${detail?.timestamp ? new Date(detail.timestamp).toLocaleTimeString() : 'Just now'}</small>`;
    } else if (status === 'syncing') {
        syncStatusDot.classList.add('pending');
        syncStatusDot.title = 'Sync: Communicating with cloud...';
        syncModalDetailText.innerHTML = '<strong>Status:</strong> Synchronizing data with Cloudflare KV...';
    } else if (status === 'pending') {
        syncStatusDot.classList.add('pending');
        syncStatusDot.title = 'Sync: Local modifications pending (45s debounce)';
        syncModalDetailText.innerHTML = '<strong>Status:</strong> Changes queued for auto-push.';
    } else if (status === 'error') {
        syncStatusDot.classList.add('error');
        syncStatusDot.title = `Sync Error: ${detail || 'Failed'}`;
        syncModalDetailText.innerHTML = `<strong style="color: #f87171;">Error:</strong> ${detail || 'Network handshake failed.'}`;
    } else {
        syncStatusDot.classList.add('local-only');
        syncStatusDot.title = 'Sync: Local Only (No Passkey)';
        syncModalDetailText.innerHTML = '<strong>Status:</strong> Local Only.<br><small>Configure your secret passkey in Settings to enable cloud sync.</small>';
    }
}

// Force Sync Action with Instant Visual UI Re-render
forceSyncNowBtn.addEventListener('click', async () => {
    if (!window.SyncEngine) return;
    
    forceSyncNowBtn.disabled = true;
    forceSyncNowBtn.textContent = 'Syncing...';

    try {
        await SyncEngine.forceImmediateSync();
        // Immediately re-render tasks so freshly pulled remote items display instantly
        renderTaskTree();
    } catch (e) {
        console.error('Manual force sync failed:', e);
    } finally {
        forceSyncNowBtn.disabled = false;
        forceSyncNowBtn.textContent = 'Force Sync Now';
        syncModal.classList.remove('open');
    }
});

// Event listener for cloud updates triggered anywhere in the window
window.addEventListener('taskitator-synced', () => {
    renderTaskTree();
});

// Sync Status Modal Triggers
syncStatusDot.addEventListener('click', () => {
    syncModal.classList.add('open');
});

closeSyncModalBtn.addEventListener('click', () => {
    syncModal.classList.remove('open');
});

syncModal.addEventListener('click', (e) => {
    if (e.target === syncModal) {
        syncModal.classList.remove('open');
    }
});

// =========================================================================
// 3. App Initialization & Drawer Handling
// =========================================================================
document.addEventListener('DOMContentLoaded', async () => {
    renderTaskTree();

    if (window.SyncEngine) {
        SyncEngine.onStatusChange((status, detail) => {
            updateSyncUI(status, detail);
        });

        if (SyncEngine.isConfigured()) {
            updateSyncUI('syncing');
            // Pull cloud updates and instantly redraw tree if remote tasks arrived
            await SyncEngine.pull(() => {
                renderTaskTree();
            });
        } else {
            updateSyncUI('local-only');
        }
    }

    // Check Active Break Status
    if (window.TaskitatorEngine) {
        const onBreak = TaskitatorEngine.BreakEngine.isCurrentlyOnBreak();
        const breakBanner = document.getElementById('activeBreakBanner');
        if (breakBanner) {
            breakBanner.style.display = onBreak ? 'block' : 'none';
        }
    }
});

// Sidebar Drawer
const sidebarDrawer = document.getElementById('sidebarDrawer');
const drawerBackdrop = document.getElementById('drawerBackdrop');

document.getElementById('openDrawerBtn').addEventListener('click', () => {
    sidebarDrawer.classList.add('open');
    drawerBackdrop.classList.add('open');
});

drawerBackdrop.addEventListener('click', () => {
    sidebarDrawer.classList.remove('open');
    drawerBackdrop.classList.remove('open');
});

// =========================================================================
// Service Worker Registration
// =========================================================================
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .catch(err => console.error('SW Registration failed:', err));
    });
}
</script>
</body>
</html>
