name: Sentry security review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Review changed code
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WARDEN_MODEL: google/gemini-3.8-flash
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_API_KEY" ]; then
            echo 'Add the GEMINI_API_KEY repository secret to enable security reviews.' >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BASE"
          fi
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            echo 'The previous commit is unavailable; the change cannot be reviewed.' >&2
            exit 1
          fi
          npx --yes @sentry/warden@0.52.0 "$base..HEAD" --git --skill security-review --fail-on high --no-color
