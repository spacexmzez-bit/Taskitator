<!DOCTYPE html>
<html lang="en" class="auth-pending">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'  https://*.clerk.accounts.dev https://*.clerk.accounts.com https://*.clerk.com https://*.mazendev.com https://challenges.cloudflare.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://*.clerk.accounts.dev https://*.clerk.accounts.com https://*.clerk.com https://*.mazendev.com https://challenges.cloudflare.com; connect-src 'self' https://taskitator-sync.spacexmzez.workers.dev https://*.protect.clerk.com:* https://clerk-telemetry.com https://*.clerk-telemetry.com https://*.clerk.accounts.dev https://*.clerk.accounts.com https://*.clerk.com https://*.mazendev.com https://challenges.cloudflare.com; frame-src https://*.clerk.accounts.dev https://*.clerk.accounts.com https://*.clerk.com https://*.mazendev.com https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self' https://*.clerk.accounts.dev https://*.clerk.accounts.com https://*.clerk.com https://*.mazendev.com https://challenges.cloudflare.com; upgrade-insecure-requests">
<script src="auth-config.js"></script>
<script src="auth-client.js"></script>
<script src="vault-client.js"></script>
<style>.auth-pending body > :not(#authLoadingStatus){visibility:hidden}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure login — Taskitator</title><link rel="stylesheet" href="style.css">
<style>body{display:flex;justify-content:center;min-height:100vh;padding:32px 16px}.login-card{width:min(100%,480px);height:fit-content;background:var(--card-bg,#182133);padding:28px;border-radius:16px;border:1px solid var(--border-color,#334155)}[hidden]{display:none!important}input{width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box}button{margin:8px 6px 8px 0;padding:12px;cursor:pointer}#loginFeedback{white-space:pre-wrap;color:#fbbf24}#secureSignIn{margin-top:20px}</style>
</head><body><main class="login-card"><h1>Taskitator</h1><p>Sign in securely to access your tasks.</p>
<div id="secureSignIn"></div>
<section id="signedInPanel" hidden><p id="signedInEmail"></p><button id="signOutLoginBtn">Use another login</button><button id="continueBtn" hidden>Continue</button></section>
<section id="recoveryPanel" hidden aria-label="Recovered device copies"></section>
<section id="connectPanel" hidden><h2>Connect your tasks</h2><p>Already used Taskitator? Connect your existing account once to keep its data. First pause your phone’s blocking macro while you replace its old token.</p>
<form id="migrationForm"><label for="legacyUsername">Existing Taskitator username</label><input id="legacyUsername" autocomplete="username" required maxlength="240"><label for="legacyPassword">Existing Taskitator password</label><input id="legacyPassword" type="password" autocomplete="current-password" required maxlength="1024"><button id="migrateAccountBtn" type="submit">Connect existing account</button></form>
<hr><p>New to Taskitator?</p><button id="newAccountBtn" type="button">Create a new Taskitator account</button></section>
<p id="loginFeedback" hidden></p></main>
<script type="text/taskitator-script" src="safety.js"></script><script type="text/taskitator-script" src="audit-engine.js"></script><script type="text/taskitator-script" src="recurrence-core.js"></script><script type="text/taskitator-script" src="recurrence-ui.js"></script><script type="text/taskitator-script" src="sync-engine.js"></script><script type="text/taskitator-script" src="login-page.js"></script>
<script defer src="auth-bootstrap.js"></script>
</body></html>
